name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy game into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html three.min.js icon-192.png icon-512.png manifest.webmanifest android/app/src/main/assets/www/
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jobar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jobar-apk
          path: jobar.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: معركة جوبر - تطبيق أندرويد
          body: حمّل ملف jobar.apk على هاتف أندرويد وثبّته.
          files: jobar.apk
          make_latest: true
