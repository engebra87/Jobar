<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15110f">
<meta name="description" content="معركة جوبر: لعبة إطلاق نار ثلاثية الأبعاد">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}html,body{margin:0;background:#15110f;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
<title>معركة جوبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Rajdhani:wght@600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen first-person frame — 3D street fills the frame, weapon controls docked beneath */
:root{
  --night:#15110f;
  --dust:#c9b79c;
  --ash:#8a7d6e;
  --fire:#f08a24;
  --blood:#c8412f;
  --panel:#221b17;
  --line:#3a2f28;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
#game{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box}
#game.rot{position:fixed;padding:8px 14px;background:var(--night);transform-origin:0 0;transform:rotate(90deg)}
body{background:var(--night);color:var(--dust);font-family:var(--body);padding-inline:16px;padding-block:10px;box-sizing:border-box;overflow:hidden}
.frame{position:relative;width:100%;max-width:1200px;flex:1;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{filter:contrast(1.14) saturate(1.35)}
#hud{touch-action:none;cursor:none}
.bar{display:flex;gap:8px;width:100%;max-width:1200px;justify-content:center;flex-wrap:wrap}
.bar button{font-family:var(--body);font-weight:800;font-size:16px;color:var(--dust);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 16px;min-width:84px;cursor:pointer}
.bar button svg{display:block;height:26px;width:auto;fill:currentColor;margin:auto}
#game.rot .bar button svg{height:20px}
.bar button:disabled{opacity:.45;cursor:not-allowed}
.bar button[aria-pressed="true"]{border-color:var(--fire);color:var(--fire);box-shadow:inset 0 -3px 0 var(--fire)}
.bar button:focus-visible,.overlay button:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(12,9,8,.72);padding:16px}
#stageOv{background:rgba(12,9,8,.38)}
.overlay h1{font-family:var(--display);font-size:clamp(30px,7vw,64px);margin:0;color:var(--dust);text-wrap:balance;text-shadow:0 0 24px rgba(240,138,36,.35)}
.overlay h1 span{color:var(--fire)}
#pauseOv h1{font-size:clamp(22px,4vw,34px);margin-bottom:6px}
.overlay p{margin:0;max-width:52ch;color:var(--ash);font-size:clamp(13px,2.4vw,17px);line-height:1.6}
.overlay .keys{font-size:13px}
.overlay button{font-family:var(--display);font-size:22px;font-weight:700;background:var(--fire);color:#1a0f06;border:0;border-radius:6px;padding:10px 34px;cursor:pointer}
#game.rot .bar button{padding:5px 12px;font-size:14px;min-width:70px}
#game.rot .overlay{gap:8px}
#game.rot .overlay p{font-size:13px}
.stages{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.overlay .stages button{font-family:var(--body);font-size:14px;font-weight:700;background:transparent;color:var(--dust);border:1px solid var(--ash);padding:6px 12px}
.overlay .stages button:hover{border-color:var(--fire);color:var(--fire)}
.overlay{z-index:3;overflow-y:auto}
#fireBtn{position:absolute;right:26px;bottom:84px;width:86px;height:86px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(200,45,30,.5);color:#fff;touch-action:none;z-index:2;display:grid;place-items:center;padding:0;cursor:pointer}
#fireBtn svg{width:44px;height:44px}#fireBtn:active{background:rgba(230,60,40,.75)}
.overlay>*:first-child{margin-top:auto}.overlay>*:last-child{margin-bottom:auto}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:220px}
.mode p{font-size:13px!important;margin:0}
.overlay #goA{background:#c8412f;color:#fff}.overlay #goA small{font-family:var(--body);font-size:12px;background:#fff;color:#c8412f;border-radius:4px;padding:1px 6px;vertical-align:middle}
#start h1{font-size:clamp(28px,6vw,54px)}
#pauseBtn{position:absolute;left:12px;top:8px;width:36px;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(8,10,12,.55);color:#f2f2f2;z-index:2;display:grid;place-items:center;padding:0;cursor:pointer}
#pauseBtn svg{width:20px;height:20px;fill:currentColor}
.menu{display:flex;flex-direction:column;gap:8px;min-width:min(280px,80vw)}
.overlay .menu button{font-size:17px;padding:9px 18px}
.overlay .menu button.sec{background:rgba(255,255,255,.08);color:var(--dust);border:1px solid var(--line)}
.overlay .menu button.danger{color:#ff8a7a;border-color:#7a3a30}
.stat{font-family:var(--display);font-size:clamp(18px,4vw,28px);color:var(--dust)}
</style>

<style>.install{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:560px}
#installBtn{background:#2f7d4a!important;color:#fff!important;font-size:18px!important;padding:8px 22px!important}
#howBtn{background:transparent!important;color:#e8dcc6!important;border:1px solid #8a7d6e!important;font-family:Tajawal,sans-serif!important;font-size:14px!important;padding:6px 14px!important}
#howTxt{flex-basis:100%;font-size:14px!important;line-height:1.8;color:#efe4cf!important;background:rgba(0,0,0,.45);border-radius:8px;padding:10px 14px!important}</style>
</head>
<body>
<div id="game">
<div class="frame" id="frame" dir="rtl">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="hud" aria-label="ساحة المعركة"></canvas>
  <button id="fireBtn" type="button" aria-label="إطلاق" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 3v9M20 28v9M3 20h9M28 20h9" stroke="currentColor" stroke-width="3"/></svg></button>
  <div class="overlay" id="start">
    <h1>معركة <span>جوبر</span></h1>
    <div class="stat" id="bestStart"></div>
    <button id="go" type="button">ابدأ</button>
    <div class="stages" role="group" aria-label="اختر المرحلة">
      <button type="button" data-stage="1">المرحلة 1 · جوبر</button>
      <button type="button" data-stage="2">المرحلة 2 · إدلب</button>
      <button type="button" data-stage="3">المرحلة 3 · الساحل</button>
    </div>
    <div class="install">
      <button id="installBtn" type="button" hidden>تثبيت اللعبة على الهاتف</button>
      <button id="howBtn" type="button">كيف أثبّتها؟</button>
      <p id="howTxt" hidden></p>
    </div>
    <p class="keys">المس أو انقر للتصويب والإطلاق (اضغط مطوّلاً للرشق) · 1 رشاش · 2 RPG · 3 مدفعية · 4 قناص · R تلقيم · للتقريب: باعد إصبعين أو استخدم عجلة الفأرة</p>
  </div>
  <button id="pauseBtn" type="button" aria-label="القائمة" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div class="overlay" id="pauseOv" hidden>
    <h1>اللعبة <span>متوقفة</span></h1>
    <div id="menuMain" class="menu">
      <button id="mResume" type="button">متابعة</button>
      <button id="mRestartStage" type="button" class="sec">إعادة المرحلة</button>
      <button id="mRestartGame" type="button" class="sec">إعادة اللعبة من البداية</button>
      <button id="mSettings" type="button" class="sec">الإعدادات</button>
      <button id="mExit" type="button" class="sec danger">الخروج</button>
    </div>
    <div id="setPanel" class="menu" hidden>
      <button id="sMute" type="button" class="sec"></button>
      <button id="sGfx" type="button" class="sec"></button>
      <button id="sShake" type="button" class="sec"></button>
      <button id="sBack" type="button">رجوع</button>
    </div>
  </div>
  <div class="overlay" id="stageOv" hidden>
    <h1 id="stageTitle"></h1>
    <p id="stageText"></p>
    <button id="stageBtn" type="button"></button>
  </div>
  <div class="overlay" id="over" hidden>
    <h1>سقط <span>الموقع</span></h1>
    <div class="stat" id="final"></div>
    <p id="bestOver"></p>
    <button id="again" type="button">أعد المحاولة</button>
  </div>
</div>
<div class="bar" dir="rtl">
  <button id="bRifle" type="button" aria-pressed="true" aria-label="رشاش" title="رشاش"><svg viewBox="0 0 64 24" aria-hidden="true"><path d="M2 9.5 13 8.2l2.5-1.4H41V5.6h3.2v1.2H62v2.1H44.5l-2.2 2.2H31.5l-1 1.3 2.6 7.4-3.4 1.1-3-7.8h-3.3l-1.7 3.8h-3.8l1-4.4L2 14.3z"/></svg></button>
  <button id="bRpg" type="button" aria-pressed="false" aria-label="آر بي جي" title="آر بي جي"><svg viewBox="0 0 64 24" aria-hidden="true"><path d="M3 10h37v4H3zM40 8.2h7.5L62 12l-14.5 3.8H40z"/><path d="M17 14h3.2v6H17zM27 14h3v4.5h-3zM22 6h6v4h-6z"/></svg></button>
  <button id="bSnp" type="button" aria-pressed="false" aria-label="قناص" title="قناص"><svg viewBox="0 0 64 24" aria-hidden="true"><path d="M2 11.2 12 10l3 2.2h25v-.9h22v1.6l-22 .9-1.8 1.6H25l-2 4.6h-3.4l1-4.6h-6L2 15.4z"/><rect x="20" y="5.5" width="17" height="3.4" rx="1.7"/><path d="M26 8.9h3v3.3h-3zM17.5 6h3v2.4h-3zM36.5 6h3v2.4h-3z"/></svg></button>
  <button id="bArt" type="button" aria-pressed="false" aria-label="مدفعية" title="مدفعية"><svg viewBox="0 0 64 24" aria-hidden="true"><path d="M16 15.5 52 4.2l1.3 3.4-35.5 11.6z"/><circle cx="21" cy="17" r="5.6"/><circle cx="21" cy="17" r="2" fill="var(--panel)"/><path d="M3 21.5 20 15.8l1 2.6L4.2 23.8z"/><path d="M53 3.5h4v5.2h-4z"/></svg></button>
  <button id="bReload" type="button" aria-label="تلقيم" title="تلقيم"><svg viewBox="0 0 64 24" aria-hidden="true"><path d="M26 4h9l2 3v13h-11z"/><path d="M28 8h7v2h-7zM28 12h7v2h-7z" fill="var(--panel)"/><path d="M48 12a8 8 0 1 1-2.3-5.7l2.3-2.3V11h-7l2.6-2.6A5.2 5.2 0 1 0 45.2 12z"/></svg></button>
</div>
</div>

<script src="three.min.js"></script>
<script>
(()=>{
const R=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const game=document.getElementById('game');let rot=false;
function layout(){const W=innerWidth,H=innerHeight;rot=H>W&&W<900;game.classList.toggle('rot',rot);
  if(rot){game.style.left=W+'px';game.style.top='0px';game.style.width=H+'px';game.style.height=W+'px'}else game.removeAttribute('style')}
layout();addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
const frame=document.getElementById('frame'),glc=document.getElementById('gl'),hud=document.getElementById('hud'),hx=hud.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true});renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd6c8b0,70,230);
const camera=new THREE.PerspectiveCamera(62,16/9,.05,400);
scene.add(camera);
let VW=960,VH=540,hdpr=1,baseFov=62,zoom=1,zoomT=1;
function resize(){VW=frame.clientWidth;VH=frame.clientHeight;renderer.setSize(VW,VH,false);camera.aspect=VW/VH;
  baseFov=VW/VH<1.2?78:62;camera.fov=baseFov/zoom;camera.updateProjectionMatrix();hdpr=Math.min(devicePixelRatio||1,2);hud.width=VW*hdpr;hud.height=VH*hdpr}
new ResizeObserver(resize).observe(frame);resize();

/* ---------- textures ---------- */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
function noise(g,w,h,n,cols){for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.fillRect(Math.random()*w,Math.random()*h,R(1,4),R(1,4))}}
const concreteTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#5a4a3d';g.fillRect(0,0,w,h);noise(g,w,h,2600,['#4a3c31','#6b5a4a','#3d3129','#716050'])},1);
function facade(seed){return ctex(256,256,(g,w,h)=>{
  g.fillStyle='#6a6c6d';g.fillRect(0,0,w,h);const shades=[['#9a9c9d','#8d8f90','#a6a8a8'],['#8b8d8f','#7f8284','#979a9b'],['#a3a4a3','#959796','#aeafae']][seed];
  for(let r=0,y=0;y<h;r++,y+=16){for(let x=(r%2)*-21;x<w;x+=42){g.fillStyle=shades[Math.floor(Math.random()*3)];g.fillRect(x+1.5,y+1.5,39,13);g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x+1.5,y+11,39,3.5);
    if(Math.random()<.35){g.fillStyle='rgba(60,60,60,.35)';g.fillRect(x+9,y+4,7,6);g.fillRect(x+26,y+4,7,6)}}}
  noise(g,w,h,1500,['rgba(0,0,0,.12)','rgba(255,255,255,.06)']);
  for(let f=0;f<2;f++){const y=f*128;g.fillStyle='rgba(60,62,64,.7)';g.fillRect(0,y+120,w,8);
    for(let c=0;c<2;c++){const x=c*128+34;
      if(Math.random()<.35){g.fillStyle='#120d0b';g.beginPath();g.moveTo(x-14,y+30);for(let i=0;i<9;i++)g.lineTo(x+R(-14,76),y+R(18,104));g.closePath();g.fill()}
      else{g.fillStyle='#161110';g.fillRect(x,y+36,56,64);g.fillStyle='rgba(70,72,74,.95)';g.fillRect(x-4,y+100,64,6);
        if(Math.random()<.2){g.fillStyle='rgba(240,120,40,.5)';g.fillRect(x+6,y+60,44,36)}}
      const sg=g.createLinearGradient(0,y+36,0,y);sg.addColorStop(0,'rgba(10,8,6,.55)');sg.addColorStop(1,'rgba(10,8,6,0)');g.fillStyle=sg;g.fillRect(x-6,y,68,40)}}
  for(let i=0;i<6;i++){g.fillStyle='rgba(20,15,12,.6)';g.beginPath();g.arc(R(0,w),R(0,h),R(2,6),0,7);g.fill()}
})}
const facades=[facade(0),facade(1),facade(2)];
const glowTex=ctex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
const skyTex=ctex(4,256,(g,w,h)=>{const s=g.createLinearGradient(0,0,0,h);s.addColorStop(0,'#5d8fc4');s.addColorStop(.3,'#9dbad4');s.addColorStop(.48,'#e3d6bf');s.addColorStop(.52,'#d6c8b0');s.addColorStop(1,'#bfae94');g.fillStyle=s;g.fillRect(0,0,w,h)});
const flagTex=ctex(96,64,(g)=>{const c=['#2f7d4a','#f2efe6','#141414'];for(let i=0;i<3;i++){g.fillStyle=c[i];g.fillRect(0,i*21.34,96,21.4)}
  g.fillStyle='#c8412f';for(let k=0;k<3;k++){const x=30+k*18,y=32,r=7;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.fill()}});

const regimeFlagTex=ctex(96,64,(g)=>{const c=['#ce1126','#ffffff','#000000'];for(let i=0;i<3;i++){g.fillStyle=c[i];g.fillRect(0,i*21.34,96,21.4)}
  g.fillStyle='#007a3d';for(let k=0;k<2;k++){const x=36+k*24,y=32,r=7;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.fill()}});
const placardTex=ctex(160,200,(g,w,h)=>{g.fillStyle='#c9a24a';g.fillRect(0,0,w,h);g.fillStyle='#f1ead8';g.fillRect(10,10,w-20,h-20);
  const bg=g.createLinearGradient(0,20,0,150);bg.addColorStop(0,'#7fa7c9');bg.addColorStop(1,'#d9e2ea');g.fillStyle=bg;g.fillRect(18,18,w-36,130);
  g.fillStyle='#2b2b2e';g.beginPath();g.ellipse(80,70,24,30,0,0,7);g.fill();g.beginPath();g.moveTo(30,148);g.quadraticCurveTo(34,104,80,100);g.quadraticCurveTo(126,104,130,148);g.closePath();g.fill();
  g.fillStyle='#8a1a1a';g.font='bold 30px Tajawal, "Noto Naskh Arabic", sans-serif';g.textAlign='center';g.direction='rtl';g.fillText('الأسد',80,184)});
/* ---------- world ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,16,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));scene.add(sky);
const hemi=new THREE.HemisphereLight(0xe8eef5,0x7a6450,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d8,1.05);sun.position.set(22,48,-2);sun.target.position.set(0,0,-34);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:5,far:140});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0015;
const fireLights=[];for(const [x,z] of [[-9,-40],[10,-70],[-6,-95]]){const l=new THREE.PointLight(0xff7a2a,2.2,26);l.position.set(x,3,z);scene.add(l);fireLights.push(l)}
const boomLights=[0,1,2].map(()=>{const l=new THREE.PointLight(0xffa040,0,30);scene.add(l);return l});let boomIdx=0;

const env=[];
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,320),mat(0xa4a4a4,{map:concreteTex}));concreteTex.repeat.set(30,40);ground.rotation.x=-Math.PI/2;ground.position.z=-130;scene.add(ground);env.push(ground);
const dirtTex=ctex(512,512,(g,w,h)=>{const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#8e9093');bg.addColorStop(.5,'#7a7c80');bg.addColorStop(1,'#9a9c9e');g.fillStyle=bg;g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){const x=Math.random()*w,y=Math.random()*h,r=R(30,110),c=['110,112,116','150,152,154','95,97,100','170,171,172','128,130,133'][i%5];
    for(const [ox,oy] of[[0,0],[w,0],[-w,0],[0,h],[0,-h]]){const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,`rgba(${c},.55)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,r*2,r*2)}}
  noise(g,w,h,6000,['rgba(60,62,66,.35)','rgba(200,202,204,.25)','rgba(90,92,96,.3)'])},1);dirtTex.repeat.set(10,14);ground.material.map=dirtTex;
const _c0=scene.children.length;
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,300),mat(0x55575b));road.rotation.x=-Math.PI/2;road.position.set(3,.01,-130);road.rotation.z=.04;scene.add(road);env.push(road);

    e.hit=Math.max(0,e.hit-dt);const tx=P.x+Math.sin(e.t*.35)*18,tz=P.z-22,hx2=tx-e.x,hz=tz-e.z,hd=Math.hypot(hx2,hz)||1,sp=Math.min(hd,12*dt);e.x+=hx2/hd*sp;e.z+=hz/hd*sp;

/* controls: floating joystick (left half) · drag-to-look (right half) · fire button that also drags to aim */
const LOOK=.0062;
function lookBy(dx,dy){const k=LOOK/Math.max(1,zoom*.8);P.yaw-=dx*k;P.pitch=Math.max(-1.1,Math.min(1.1,P.pitch-dy*k*.85))}
function aDown(ev){if(!running)return;ev.preventDefault();hud.setPointerCapture?.(ev.pointerId);const l=localPt(ev);
  if(l.x<l.w*.45&&!joy)joy={id:ev.pointerId,sx:l.x,sy:l.y,dx:0,dy:0};else AT.set(ev.pointerId,{x:l.x,y:l.y})}
function aMove(ev){const l=localPt(ev);if(joy&&joy.id===ev.pointerId){let dx=(l.x-joy.sx)/50,dy=(l.y-joy.sy)/50;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;joy.sx=l.x-dx*50;joy.sy=l.y-dy*50}joy.dx=dx;joy.dy=dy;return}
  const a=AT.get(ev.pointerId);if(a){lookBy(l.x-a.x,l.y-a.y);a.x=l.x;a.y=l.y}}
function aUp(ev){if(joy&&joy.id===ev.pointerId)joy=null;AT.delete(ev.pointerId)}
function aimAssist(dt){let best=null,ba=.09;const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  for(const e of S.ents){if(!alive(e)||e.type==='h')continue;const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz);if(d<2||d>70)continue;const a=Math.abs(angTo(P.yaw,Math.atan2(-dx,-dz)));if(a<ba&&(e.los??true)){ba=a;best=e}}
  if(best){const dx=best.x-P.x,dz=best.z-P.z,d=Math.hypot(dx,dz),ty=Math.atan2(-dx,-dz),tp=Math.atan2((best.type==='s'?1.2:1.8)+groundY(best.x,best.z)-camera.position.y,d);const k=Math.min(1,dt*(firing?4:1.6));P.yaw+=angTo(P.yaw,ty)*k;P.pitch+=(tp-P.pitch)*k*.6}}
function drawJoy(){if(MODE!=='assault'||!running)return;  const bx=joy?joy.sx:VW*.15,by=joy?joy.sy:VH*.62;hx.globalAlpha=joy?.9:.5;
  hx.strokeStyle='rgba(255,255,255,.75)';hx.lineWidth=2;hx.beginPath();hx.arc(bx,by,52,0,7);hx.stroke();hx.fillStyle='rgba(255,255,255,.35)';hx.beginPath();hx.arc(bx+(joy?joy.dx*52:0),by+(joy?joy.dy*52:0),24,0,7);hx.fill();
  if(!joy){hx.fillStyle='rgba(255,255,255,.8)';hx.font='700 12px Tajawal, sans-serif';hx.textAlign='center';hx.direction='rtl';hx.fillText('حرّك',bx,by+72);hx.direction='ltr'}hx.globalAlpha=1}
/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const rdt=Math.min(.05,(now-last)/1000);last=now;let dt=rdt;if(S&&S.slow>0&&running){S.slow-=rdt;if(!reduce)dt=rdt*.35}if(running)update(dt);if(S)ambientTick();updateAllies(dt);updateFw(rdt);updateFx(rdt>dt?rdt:dt);updateCamera(dt);
  if(!running&&S)for(const e of S.ents){if(e.type==='t')e.m.turret.rotation.y=Math.sin(now/1500)*.3;if(e.type==='h'){e.m.rotor.rotation.y+=.4;e.m.g.position.x=Math.sin(now/2200)*4}}
  renderer.render(scene,camera);drawHud();requestAnimationFrame(loop)}

/* ---------- input ---------- */
function localPt(ev){if(!rot){const r=hud.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top,w:r.width,h:r.height}}
  const gx=ev.clientY,gy=innerWidth-ev.clientX;return{x:gx-frame.offsetLeft-frame.clientLeft,y:gy-frame.offsetTop-frame.clientTop,w:frame.clientWidth,h:frame.clientHeight}}
function setPtr(ev){const l=localPt(ev);ndc.x=Math.max(-1,Math.min(1,l.x/l.w*2-1));ndc.y=Math.max(-1,Math.min(1,-(l.y/l.h)*2+1));ptr.x=ndc.x;ptr.y=ndc.y}
const touches=new Map();let pinchD=0,pinchZ=1;
const pdist=()=>{const [a,b]=[...touches.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
hud.addEventListener('pointerdown',ev=>{if(MODE==='assault'){aDown(ev);return}if(!running)return;ev.preventDefault();hud.setPointerCapture?.(ev.pointerId);touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(touches.size>=2){firing=false;pinchD=pdist();pinchZ=zoomT;return}setPtr(ev);firing=true});
hud.addEventListener('pointermove',ev=>{if(MODE==='assault'){aMove(ev);return}if(touches.has(ev.pointerId))touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(touches.size>=2&&pinchD){zoomT=Math.max(1,Math.min(4,pinchZ*pdist()/pinchD));return}setPtr(ev)});
const stop=ev=>{if(MODE==='assault'){aUp(ev);return}touches.delete(ev.pointerId);if(touches.size<2)pinchD=0;if(!touches.size)firing=false};hud.addEventListener('pointerup',stop);hud.addEventListener('pointercancel',stop);
hud.addEventListener('wheel',ev=>{ev.preventDefault();zoomT=Math.max(1,Math.min(4,zoomT*(ev.deltaY<0?1.15:1/1.15)))},{passive:false});

function begin(n,mode='defend'){paused=false;document.getElementById('pauseOv').hidden=true;lastMode=mode;P.x=0;P.z=6;P.yaw=0;P.pitch=0;zoomT=1;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume?.()}catch(e){}

  const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem('somoud-best',best)}catch(e){}}document.getElementById('bestOver').textContent=nb?'رقم قياسي جديد!':'أفضل نتيجة: '+best;showBest()}
document.getElementById('stageBtn').onclick=()=>S&&nextStage();
{const $=id=>document.getElementById(id);$('pauseBtn').onclick=pauseGame;$('mResume').onclick=resumeGame;$('mRestartStage').onclick=()=>{const st=S.stage;begin(st)};$('mRestartGame').onclick=()=>begin(1);
  $('mSettings').onclick=()=>{$('menuMain').hidden=true;$('setPanel').hidden=false;applySettings()};$('sBack').onclick=()=>{$('menuMain').hidden=false;$('setPanel').hidden=true};
  $('sMute').onclick=()=>{SET.mute=!SET.mute;saveSet();applySettings()};$('sGfx').onclick=()=>{SET.gfx=SET.gfx==='low'?'high':'low';saveSet();applySettings()};$('sShake').onclick=()=>{SET.shake=!SET.shake;saveSet();applySettings()};$('mExit').onclick=exitGame;
  setInterval(()=>{$('pauseBtn').hidden=!running},250);setTimeout(applySettings,0)}document.getElementById('go').onclick=()=>begin(1);document.getElementById('again').onclick=()=>begin(1);
{const fb=document.getElementById('fireBtn');let fl0=null;fb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fb.setPointerCapture?.(e.pointerId);fireHeld=true;fl0=localPt(e);if(running)firing=true});fb.addEventListener('pointermove',e=>{if(!fireHeld||!fl0)return;const l=localPt(e);lookBy(l.x-fl0.x,l.y-fl0.y);fl0=l});const fu=e=>{fireHeld=false;fl0=null;firing=false};fb.addEventListener('pointerup',fu);fb.addEventListener('pointercancel',fu);fb.addEventListener('lostpointercapture',fu)}
addEventListener('keydown',e=>{KEYS[e.key.toLowerCase()]=1;if(MODE==='assault'&&e.key===' '&&running){firing=true;e.preventDefault()}});addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=0;if(MODE==='assault'&&e.key===' ')firing=false});
